name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # One code base, two repositories. The "Deploy target" step derives the
  # address and the mode from the repository this runs in:
  #   imevstratov-pixel/portfolio (the live site): SITE https://danilevstratov.ru,
  #     BASE / (the custom domain of its Pages, decision 22 of 15.10), PREVIEW 0
  #     (Yandex Metrika, indexing, sitemap.xml);
  #   any other, e.g. imevstratov-pixel/portfolio-v2 (staging):
  #     SITE https://imevstratov-pixel.github.io, BASE /<repository name>/,
  #     PREVIEW 1 (noindex, no analytics).
  # The live build serves the domain root, so it only works once the domain
  # is set in the repository's Pages settings (github.io/portfolio/ then
  # redirects there).
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy target
        run: |
          if [ "$GITHUB_REPOSITORY" = "imevstratov-pixel/portfolio" ]; then
            echo "SITE=https://danilevstratov.ru" >> "$GITHUB_ENV"
            echo "BASE=/" >> "$GITHUB_ENV"
            echo "PREVIEW=0" >> "$GITHUB_ENV"
          else
            echo "SITE=https://imevstratov-pixel.github.io" >> "$GITHUB_ENV"
            echo "BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
            echo "PREVIEW=1" >> "$GITHUB_ENV"
          fi
      - run: echo "Building $SITE$BASE with PREVIEW=$PREVIEW"
      - run: npm ci
      - run: npm run build
      - run: npm run check-links
      # internal notes, then the deploy mode (tools/prodcheck.mjs): Metrika,
      # robots, sitemap, old URLs and old home anchors
      - run: npm run leakcheck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
